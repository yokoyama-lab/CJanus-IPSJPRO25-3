name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build and test (Go workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: compiler/go.mod
          cache-dependency-path: |
            go.work.sum
            runtime/go.sum

      # `go build ./...` at the root is rejected in workspace mode, so the
      # three modules listed in go.work are named explicitly.
      - name: build
        run: go build ./compiler/... ./runtime/... ./util/...

      - name: vet
        run: go vet ./compiler/... ./runtime/... ./util/...

      - name: compile the sample programs and compare with the committed CRIL
        run: |
          set -euo pipefail
          for p in fib sieve airline; do
            go run ./compiler -o "/tmp/$p.crl" "progs/$p.cj"
            diff -u "progs/$p.crl" "/tmp/$p.crl"
          done

      - name: test (compiler, runtime)
        run: go test ./compiler/... ./runtime/...

      # util.TestPriorityLock currently panics with
      # "sync: negative WaitGroup counter" on every run (pre-existing), so it
      # is reported but does not block the workflow until it is fixed.
      - name: test (util, known failure, non-blocking)
        continue-on-error: true
        run: go test ./util/...
